<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vintify — Suivi</title>
<link rel="icon" type="image/png" href="/favicon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--page:#f8fafc;--card:rgba(255,255,255,.82);--line:#e2e8f0;--ink:#0f172a;--muted:#64748b;--dark:#0f172a;--primary:#6366f1;--good:#10b981;--warn:#f59e0b;--bad:#ef4444;--shadow-s:0 4px 20px -6px rgba(15,23,42,.07);--shadow-m:0 12px 32px -8px rgba(99,102,241,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--page)}
h1,h2,h3,h4,.stat-val{font-family:'Outfit',sans-serif}
nav{position:sticky;top:10px;z-index:10;max-width:1500px;margin:14px auto 0;padding:10px 18px;border:1px solid rgba(255,255,255,.8);border-radius:18px;background:rgba(255,255,255,.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--shadow-s);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;will-change:transform}
.brand{display:flex;align-items:center;gap:10px}
.brand-dot{width:28px;height:28px;border-radius:10px;background:linear-gradient(135deg,var(--primary),#8b5cf6);display:grid;place-items:center;color:#fff;font-weight:800;font-size:.75rem}
.brand h1{font-size:1.05rem;font-weight:700}
.brand span{font-size:.72rem;color:var(--muted)}
.nav-mid{display:flex;gap:4px;background:rgba(248,250,252,.8);padding:3px;border-radius:14px;border:1px solid var(--line)}
.nav-mid a{font-size:.8rem;font-weight:600;text-decoration:none;padding:7px 14px;border-radius:11px;color:var(--muted)}
.nav-mid a.active{background:var(--dark);color:#fff}
.nav-end{display:flex;align-items:center;gap:8px}
.nav-end .who{font-size:.72rem;color:var(--muted)}
main{max-width:1500px;margin:18px auto 0;padding:0 14px 30px}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid #fff;border-radius:16px;padding:12px 14px;box-shadow:var(--shadow-s)}
.stat-label{font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--muted)}
.stat-val{font-size:1.5rem;font-weight:800;letter-spacing:-.03em;margin-top:3px}
.stat.amber .stat-val{color:var(--warn)}.stat.purple .stat-val{color:var(--primary)}.stat.blue .stat-val{color:#3b82f6}.stat.green .stat-val{color:var(--good)}.stat.red .stat-val{color:var(--bad)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;background:var(--card);border:1px solid #fff;border-radius:16px;padding:12px;box-shadow:var(--shadow-s)}
.toolbar input{flex:1;min-width:180px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;font-size:.82rem;font-family:inherit;outline:none}
.toolbar input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.toolbar select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;font-size:.82rem;font-family:inherit}
.filters{display:flex;gap:4px;background:var(--page);padding:3px;border-radius:12px;border:1px solid var(--line);flex-wrap:wrap}
.fbtn{border:none;cursor:pointer;border-radius:9px;padding:6px 10px;color:var(--muted);background:transparent;font-weight:600;font-size:.7rem;font-family:inherit}
.fbtn.active{color:#fff;background:var(--dark)}
.btn{border:none;border-radius:10px;padding:8px 12px;font-size:.78rem;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:4px;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn-ghost{color:var(--ink);background:#fff;border:1px solid var(--line)}
.btn-danger{color:#991b1b;background:#fef2f2;border:1px solid #fecaca}
.btn-fiche{color:#fff;background:linear-gradient(135deg,var(--primary),#8b5cf6);box-shadow:0 4px 12px -4px rgba(99,102,241,.3)}
.btn-edit{color:var(--muted);background:#fff;border:1px solid var(--line);padding:6px 8px}
.btn-edit:hover{border-color:var(--primary);color:var(--primary);background:rgba(99,102,241,.04)}

/* ===== PREVIEW MODAL (read-only) ===== */
.pv-overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:120;padding:14px}
.pv-overlay.open{display:flex}
.pv-box{width:min(880px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;box-shadow:0 24px 48px -12px rgba(15,23,42,.25);padding:24px;position:relative}
.pv-close{position:absolute;top:14px;right:14px;border:none;background:var(--page);width:32px;height:32px;border-radius:10px;cursor:pointer;font-size:1rem}
.pv-close:hover{background:var(--line)}
.pv-head{margin-bottom:16px;padding-right:36px}
.pv-head h3{font-size:1.2rem;letter-spacing:-.02em;margin-bottom:4px;font-family:'Outfit',sans-serif}
.pv-head .pv-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pv-head .pv-meta .tag{font-size:.68rem}
.pv-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pv-section{background:var(--page);border:1px solid var(--line);border-radius:12px;padding:14px}
.pv-section h4{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:10px;font-weight:700;font-family:'Outfit',sans-serif}
.pv-images{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px}
.pv-images .pv-img{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.pv-images img{width:100%;height:100%;object-fit:cover;display:block}
.pv-images .pv-dl{position:absolute;bottom:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(99,102,241,.85);color:#fff;font-size:.65rem;display:grid;place-items:center;text-decoration:none}
.pv-empty{font-size:.78rem;color:var(--muted);text-align:center;padding:18px}
.pv-field{margin-bottom:12px;position:relative}
.pv-field:last-child{margin-bottom:0}
.pv-field label{display:block;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.pv-field .pv-val{font-size:.85rem;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-height:38px;white-space:pre-wrap;word-break:break-word}
.pv-field .pv-val.muted{color:var(--muted);font-style:italic}
.pv-copy{position:absolute;top:0;right:0;border:none;background:rgba(99,102,241,.1);color:var(--primary);font-size:.65rem;font-weight:700;padding:3px 8px;border-radius:6px;cursor:pointer}
.pv-copy.copied{background:var(--good);color:#fff}
.pv-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.pv-actions .btn{flex:1;min-width:130px;padding:11px}
@media(max-width:700px){.pv-grid{grid-template-columns:1fr}}
.btn-primary{color:#fff;background:linear-gradient(135deg,var(--primary),#8b5cf6);box-shadow:var(--shadow-m)}
.table-wrap{background:var(--card);border:1px solid #fff;border-radius:18px;box-shadow:var(--shadow-s);overflow:hidden}
.table-scroll{overflow-x:auto}
table{width:100%;min-width:1100px;border-collapse:collapse}
th,td{padding:10px;text-align:left;font-size:.78rem;vertical-align:middle}
th{position:sticky;top:0;z-index:2;background:rgba(255,255,255,.98);color:var(--muted);text-transform:uppercase;font-size:.62rem;letter-spacing:.06em;border-bottom:1px solid var(--line);font-weight:700}
tr{border-bottom:1px solid var(--line)}
tbody tr:hover{background:rgba(248,250,252,.8)}
.photo-cell{display:flex;align-items:center;gap:6px}
.photo-cell img{width:40px;height:40px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
.photo-cell .ph{width:40px;height:40px;border-radius:8px;background:var(--page);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.photo-cell .cnt{font-size:.65rem;font-weight:600;color:var(--muted);padding:3px 6px;border-radius:999px;background:var(--page);border:1px solid var(--line)}
.title-cell strong{display:block;font-size:.82rem}
.title-cell span{color:var(--muted);font-size:.68rem;display:block;margin-top:1px}
.tag{border-radius:999px;padding:3px 8px;font-size:.62rem;font-weight:700;display:inline-flex;width:max-content}
.tag.amber{color:#92400e;background:#fef3c7;border:1px solid #fde68a}
.tag.purple{color:#5b21b6;background:#ede9fe;border:1px solid #c4b5fd}
.tag.blue{color:#1e40af;background:#dbeafe;border:1px solid #bfdbfe}
.tag.green{color:#065f46;background:#d1fae5;border:1px solid #a7f3d0}
.tag.red{color:#991b1b;background:#fee2e2;border:1px solid #fecaca}
.tag.neutral{color:var(--muted);background:var(--page);border:1px solid var(--line)}
.empty-row td{text-align:center;color:var(--muted);padding:24px;font-size:.85rem}
.banner{display:none;margin-bottom:14px;padding:12px 16px;border-radius:14px;background:#fef2f2;border:1px solid #fecaca;color:#991b1b;font-size:.8rem}
#toast{position:fixed;bottom:20px;right:20px;background:var(--dark);color:#fff;padding:10px 18px;font-size:.8rem;border-radius:12px;font-weight:600;opacity:0;transform:translateY(16px);transition:all .35s;z-index:200}
#toast.show{opacity:1;transform:translateY(0)}
#toast.error{background:var(--bad)}
.chk{appearance:none;width:20px;height:20px;border-radius:6px;border:2px solid #cbd5e1;background:#fff;cursor:pointer;position:relative;transition:border-color .15s,background .15s}
.chk:hover{border-color:var(--primary)}
.chk:checked{border-color:var(--primary);background:var(--primary);box-shadow:0 2px 6px rgba(99,102,241,.3)}
.chk.green:checked{border-color:var(--good);background:var(--good);box-shadow:0 2px 6px rgba(16,185,129,.3)}
.chk.amber:checked{border-color:var(--warn);background:var(--warn);box-shadow:0 2px 6px rgba(245,158,11,.3)}
.chk:checked::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;font-weight:900;color:#fff;font-size:.7rem}
.row-acts{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.row-acts select{font-size:.7rem;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:#fff;font-family:inherit;cursor:pointer}

/* ===== SKELETON ===== */
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.skel-row td{padding:10px}
.skel-bar{height:14px;border-radius:6px;background:linear-gradient(90deg,#f1f5f9 25%,#e8ecf1 50%,#f1f5f9 75%);background-size:200% 100%;animation:shimmer 1.2s ease-in-out infinite}
.skel-bar.w60{width:60%}.skel-bar.w40{width:40%}.skel-bar.w30{width:30%}.skel-bar.w20{width:20%}

/* ===== SHOW MORE BTN ===== */
.show-more-row td{text-align:center;padding:12px}
.show-more-btn{border:none;background:rgba(99,102,241,.08);color:var(--primary);font-size:.78rem;font-weight:700;padding:10px 24px;border-radius:10px;cursor:pointer;font-family:inherit;transition:background .15s}
.show-more-btn:hover{background:rgba(99,102,241,.14)}

/* ===== ACCOUNT PICKER (toolbar) ===== */
@media(max-width:1100px){.stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){
  html,body{-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
  nav{flex-direction:column;align-items:flex-start;padding:10px 14px}
  main{padding:0 12px 24px}
  .stats{grid-template-columns:repeat(2,1fr);gap:6px}
  .stat{padding:9px 10px}
  .stat-val{font-size:1.2rem}
  .stat-label{font-size:.55rem}
  .toolbar{flex-direction:column;align-items:stretch;padding:10px;gap:6px}
  .toolbar input,.toolbar select{min-height:44px;font-size:.9rem}
  .toolbar .btn{min-height:42px}
  /* Boutons et checkbox tap-friendly */
  .btn{min-height:40px}
  .chk{width:24px;height:24px}
  /* Anim courtes */
  *,*::before,*::after{animation-duration:.2s !important;transition-duration:.2s !important}
  /* La table reste scrollable horizontalement (déjà via .table-scroll) */
  table{min-width:900px}
}
</style>
</head>
<body>

<nav>
  <div class="brand"><div class="brand-dot">V</div><div><h1>Vintify</h1><span>Suivi Pipeline</span></div></div>
  <div class="nav-mid" id="navMid">
    <a href="equipe.html">Fiche</a>
    <a href="suivi.html" class="active">Suivi</a>
  </div>
  <div class="nav-end"><span class="who" id="who"></span><button class="btn btn-ghost" onclick="logout()">Déconnexion</button></div>
</nav>

<main>
  <div class="stats">
    <div class="stat"><div class="stat-label">Total</div><div class="stat-val" id="sTotal">0</div></div>
    <div class="stat amber"><div class="stat-label">À traiter</div><div class="stat-val" id="sDraft">0</div></div>
    <div class="stat purple"><div class="stat-label">Prêts</div><div class="stat-val" id="sReady">0</div></div>
    <div class="stat blue"><div class="stat-label">Postés</div><div class="stat-val" id="sPosted">0</div></div>
    <div class="stat green"><div class="stat-label">Vendus</div><div class="stat-val" id="sSold">0</div></div>
    <div class="stat red"><div class="stat-label">Prolonger</div><div class="stat-val" id="sPending">0</div></div>
  </div>

  <div id="cfgAlert" class="banner"></div>

  <div class="toolbar">
    <input type="text" id="search" placeholder="Rechercher (titre, couleur, lien)…" oninput="debouncedRender()">
    <select id="filterAccount" onchange="render()" style="border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;font-size:.82rem;font-family:inherit"><option value="">Tous les comptes</option></select>
    <div class="filters" id="filters">
      <button class="fbtn active" data-f="all">Tous</button>
      <button class="fbtn" data-f="draft">À traiter</button>
      <button class="fbtn" data-f="ready">Prêts</button>
      <button class="fbtn" data-f="posted">Postés</button>
      <button class="fbtn" data-f="sold">Vendus</button>
      <button class="fbtn" data-f="pending_order">Prolonger</button>
    </div>
    <button class="btn btn-ghost" onclick="charger()">↻</button>
  </div>

  <div class="table-wrap"><div class="table-scroll"><table>
    <thead><tr>
      <th>Photo</th><th>Produit</th><th>Compte Vinted</th><th>Prix</th><th>Statut</th><th>Posté</th><th>Vendu</th><th>Prolongé</th><th>Warehouse</th><th>Actions</th>
    </tr></thead>
    <tbody id="tbody">
      <tr class="skel-row"><td><div class="skel-bar w30" style="height:40px;width:40px;border-radius:8px"></div></td><td><div class="skel-bar w60" style="margin-bottom:4px"></div><div class="skel-bar w40" style="height:10px"></div></td><td><div class="skel-bar w40"></div></td><td><div class="skel-bar w30"></div></td><td><div class="skel-bar w30"></div></td><td colspan="5"><div class="skel-bar w20"></div></td></tr>
      <tr class="skel-row"><td><div class="skel-bar w30" style="height:40px;width:40px;border-radius:8px"></div></td><td><div class="skel-bar w60" style="margin-bottom:4px"></div><div class="skel-bar w40" style="height:10px"></div></td><td><div class="skel-bar w40"></div></td><td><div class="skel-bar w30"></div></td><td><div class="skel-bar w30"></div></td><td colspan="5"><div class="skel-bar w20"></div></td></tr>
      <tr class="skel-row"><td><div class="skel-bar w30" style="height:40px;width:40px;border-radius:8px"></div></td><td><div class="skel-bar w60" style="margin-bottom:4px"></div><div class="skel-bar w40" style="height:10px"></div></td><td><div class="skel-bar w40"></div></td><td><div class="skel-bar w30"></div></td><td><div class="skel-bar w30"></div></td><td colspan="5"><div class="skel-bar w20"></div></td></tr>
    </tbody>
  </table></div></div>
</main>

<!-- PREVIEW MODAL (read-only) -->
<div class="pv-overlay" id="previewModal" onclick="if(event.target===this)closePreview()">
  <div class="pv-box">
    <button class="pv-close" onclick="closePreview()">✕</button>
    <div class="pv-head">
      <h3 id="pvTitle">Fiche</h3>
      <div class="pv-meta" id="pvMeta"></div>
    </div>
    <div class="pv-grid">
      <div class="pv-section">
        <h4>📷 Images</h4>
        <div class="pv-images" id="pvImages"></div>
      </div>
      <div class="pv-section">
        <h4>📝 Annonce</h4>
        <div class="pv-field"><label>Titre</label><button class="pv-copy" onclick="pvCopy('pvVTitle',this)">Copier</button><div class="pv-val" id="pvVTitle"></div></div>
        <div class="pv-field"><label>Description</label><button class="pv-copy" onclick="pvCopy('pvVDesc',this)">Copier</button><div class="pv-val" id="pvVDesc"></div></div>
        <div class="pv-field"><label>Marque</label><button class="pv-copy" onclick="pvCopy('pvVBrand',this)">Copier</button><div class="pv-val" id="pvVBrand"></div></div>
      </div>
    </div>
    <div class="pv-actions" id="pvActions"></div>
  </div>
</div>

<div id="toast"></div>

<script>
let articles=[],vaccs=[],filtre='all',profile=null;
const ROWS_PER_PAGE=50;
let rowLimit=ROWS_PER_PAGE;

/* ===== DEBOUNCE ===== */
let _renderTimer=null;
function debouncedRender(){clearTimeout(_renderTimer);_renderTimer=setTimeout(render,120)}
const STATUS_LABEL={draft:'À traiter',ready:'Prêt',posted:'Posté',sold:'Vendu',pending_order:'Prolonger'};
const STATUS_TAG={draft:'amber',ready:'purple',posted:'blue',sold:'green',pending_order:'red'};

requireAuth(['admin','employee']).then(p=>{
  if(!p)return;
  profile=p;
  document.getElementById('who').textContent=(p.name||p.email)+' · '+p.role;
  if(p.role==='admin') document.getElementById('navMid').insertAdjacentHTML('afterbegin','<a href="admin.html">Admin</a>');
  init();
});

function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function toast(m,err){const el=document.getElementById('toast');el.textContent=m;el.className='show'+(err?' error':'');setTimeout(()=>el.className='',2400)}
function showErr(h){const el=document.getElementById('cfgAlert');el.innerHTML='<strong>Erreur</strong> '+h;el.style.display='block'}
function hostName(url){try{return new URL(url).hostname.replace('www.','')}catch{return'lien'}}

async function init(){
  document.querySelectorAll('.fbtn').forEach(b=>b.onclick=()=>{
    filtre=b.dataset.f;
    document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    rowLimit=ROWS_PER_PAGE;
    render();
  });
  await charger();
}

/* ===== FETCH GUARD : empêche les double-fetch concurrents ===== */
let _fetchId=0;

async function charger(){
  const myFetch=++_fetchId;
  const [vaccRes,artRes]=await Promise.all([
    sb.from('vinted_accounts').select('id,name').order('name'),
    sb.from('articles')
      // PERF : on retire 'bordereau' (UI supprimée) et on plafonne pour éviter le statement timeout
      .select('id,title,description,brand,price,min_price,size,color,supplier_url,images,status,prolonged,warehouse,vinted_account_id,created_at, vinted_account:vinted_accounts!vinted_account_id(id,name)')
      .order('created_at',{ascending:false})
      .limit(2000)
  ]);
  if(myFetch!==_fetchId) return;
  if(artRes.error){showErr(esc(artRes.error.message));return}
  document.getElementById('cfgAlert').style.display='none';
  vaccs=vaccRes.data||[];
  articles=(artRes.data||[]).map(a=>({...a,images:Array.isArray(a.images)?a.images:[]}));
  majComptes();
  renderStats();render();
}

function majComptes(){
  const sel=document.getElementById('filterAccount');
  const cur=sel.value;
  sel.innerHTML='<option value="">Tous les comptes</option>'+vaccs.map(v=>`<option value="${v.id}"${v.id===cur?' selected':''}>${esc(v.name)}</option>`).join('');
}

function renderStats(){
  const counts={draft:0,ready:0,posted:0,sold:0,pending_order:0};
  for(let i=0;i<articles.length;i++) counts[articles[i].status]=(counts[articles[i].status]||0)+1;
  document.getElementById('sTotal').textContent=articles.length;
  document.getElementById('sDraft').textContent=counts.draft;
  document.getElementById('sReady').textContent=counts.ready;
  document.getElementById('sPosted').textContent=counts.posted;
  document.getElementById('sSold').textContent=counts.sold;
  document.getElementById('sPending').textContent=counts.pending_order;
}

/* ===== RENDER : génère le HTML d'UNE ligne (réutilisable pour patch) ===== */
function renderRow(a){
  const name=a.title||hostName(a.supplier_url||'');
  const img=a.images[0]||'';
  const tag=`<span class="tag ${STATUS_TAG[a.status]||'amber'}">${STATUS_LABEL[a.status]||a.status}</span>`;
  const vaccName=a.vinted_account?esc(a.vinted_account.name):'<span style="color:var(--muted)">—</span>';
  return`<tr data-id="${a.id}">
    <td><div class="photo-cell">${img?`<img src="${esc(img)}" loading="lazy" onerror="this.outerHTML='<div class=ph>?</div>'">`:"<div class=\"ph\">?</div>"} ${a.images.length>1?`<span class="cnt">${a.images.length}</span>`:''}</div></td>
    <td><div class="title-cell"><strong>${esc(name)}</strong><span>${esc(a.size||'—')} · ${esc(a.color||'—')}${a.brand?' · '+esc(a.brand):''}</span></div></td>
    <td>${vaccName}</td>
    <td><div style="display:grid;gap:3px"><span class="tag green">${a.price||0} €</span>${a.min_price?`<span class="tag amber">Min ${a.min_price} €</span>`:''}</div></td>
    <td>${tag}</td>
    <td><input type="checkbox" class="chk" ${(a.status==='posted'||a.status==='sold'||a.status==='pending_order')?'checked':''} onchange="togglePosted('${a.id}',this.checked)"></td>
    <td><input type="checkbox" class="chk green" ${a.status==='sold'?'checked':''} onchange="toggleSold('${a.id}',this.checked)"></td>
    <td><input type="checkbox" class="chk amber" ${a.prolonged?'checked':''} onchange="togglePending('${a.id}',this.checked)"></td>
    <td><input type="checkbox" class="chk" ${a.warehouse?'checked':''} onchange="toggleField('${a.id}','warehouse',this.checked)"></td>
    <td><div class="row-acts">
      ${a.supplier_url?`<a href="${esc(a.supplier_url)}" target="_blank" class="btn btn-ghost" style="font-size:.7rem" title="Lien fournisseur">🔗</a>`:''}
      <button class="btn btn-fiche" style="font-size:.7rem" onclick="openPreview('${a.id}')" title="Aperçu fiche">👁 Aperçu</button>
      <button class="btn btn-edit" style="font-size:.7rem" onclick="goEdit('${a.id}')" title="Modifier la fiche">✏️</button>
      ${profile&&profile.role==='admin'?`<button class="btn btn-danger" style="font-size:.7rem" onclick="supprimer('${a.id}')">✕</button>`:''}
    </div></td>
  </tr>`;
}

/* ===== PATCH : remplace UNE ligne au lieu de tout re-render ===== */
function patchRow(id){
  const a=articles.find(x=>x.id===id);
  const tr=document.querySelector(`tr[data-id="${id}"]`);
  if(!a||!tr)return;
  const tmp=document.createElement('tbody');
  tmp.innerHTML=renderRow(a);
  tr.replaceWith(tmp.firstElementChild);
}

/* ===== FILTRAGE : retourne la liste filtrée ===== */
function getFilteredList(){
  let list=articles;
  const q=document.getElementById('search').value.toLowerCase().trim();
  if(q) list=list.filter(a=>(a.title||'').toLowerCase().includes(q)||(a.color||'').toLowerCase().includes(q)||(a.supplier_url||'').toLowerCase().includes(q));
  const acc=document.getElementById('filterAccount').value;
  if(acc) list=list.filter(a=>a.vinted_account_id===acc);
  if(filtre!=='all') list=list.filter(a=>a.status===filtre);
  return list;
}

/* ===== RENDER : 2 passes pour first-paint instantané ===== */
const FAST_BATCH=15;

// Helper : injecte du HTML brut dans body via DocumentFragment (évite reflow)
function appendHtml(body, html){
  const tmp=document.createElement('tbody');
  tmp.innerHTML=html;
  const frag=document.createDocumentFragment();
  while(tmp.firstChild) frag.appendChild(tmp.firstChild);
  body.appendChild(frag);
}

function showMoreRow(remaining){
  return `<tr class="show-more-row"><td colspan="10"><button class="show-more-btn" onclick="showMoreRows()">Voir ${remaining} ligne${remaining>1?'s':''} de plus…</button></td></tr>`;
}

function render(){
  const list=getFilteredList();
  const body=document.getElementById('tbody');
  if(!list.length){body.innerHTML='<tr class="empty-row"><td colspan="10">Aucun résultat.</td></tr>';return}

  const visible=list.slice(0,rowLimit);
  const remaining=list.length-visible.length;
  const batch1=visible.slice(0,FAST_BATCH);
  const batch2=visible.slice(FAST_BATCH);

  // Phase 1 : premières lignes immédiatement
  body.textContent='';
  appendHtml(body, batch1.map(renderRow).join(''));

  // Phase 2 : reste + bouton "voir plus", dans le frame suivant (non bloquant)
  if(batch2.length || remaining>0){
    requestAnimationFrame(()=>{
      let html=batch2.map(renderRow).join('');
      if(remaining>0) html+=showMoreRow(remaining);
      appendHtml(body, html);
    });
  }
}

function showMoreRows(){
  rowLimit+=ROWS_PER_PAGE;
  render();
}

/* ===== OPTIMISTIC TOGGLES : update local + patch DOM, sync DB en arrière-plan ===== */
async function togglePosted(id,checked){
  const a=articles.find(x=>x.id===id);
  if(!a)return;
  if(!checked && (a.status==='sold'||a.status==='pending_order')){
    toast('Décoche d\'abord "Vendu"',true);
    patchRow(id); // revert visuel checkbox
    return;
  }
  const oldStatus=a.status;
  a.status=checked?'posted':'ready';
  patchRow(id); renderStats();
  const{error}=await sb.from('articles').update({status:a.status}).eq('id',id);
  if(error){a.status=oldStatus;patchRow(id);renderStats();toast('Erreur: '+error.message,true);return}
}

async function togglePending(id,checked){
  const a=articles.find(x=>x.id===id);
  if(!a)return;
  const oldP=a.prolonged, oldS=a.status;
  a.prolonged=checked;
  if(checked) a.status='pending_order';
  else if(a.status==='pending_order') a.status='sold';
  patchRow(id); renderStats();
  const{error}=await sb.from('articles').update({prolonged:a.prolonged,status:a.status}).eq('id',id);
  if(error){a.prolonged=oldP;a.status=oldS;patchRow(id);renderStats();toast('Erreur: '+error.message,true);return}
}

async function toggleField(id,field,val){
  const a=articles.find(x=>x.id===id);
  if(!a)return;
  const old=a[field];
  a[field]=val;
  patchRow(id);
  const{error}=await sb.from('articles').update({[field]:val}).eq('id',id);
  if(error){a[field]=old;patchRow(id);toast('Erreur: '+error.message,true);return}
}

async function toggleSold(id,checked){
  const a=articles.find(x=>x.id===id);
  if(!a)return;
  const oldStatus=a.status;
  a.status=checked?'sold':'posted';
  patchRow(id); renderStats();
  const{error}=await sb.from('articles').update({status:a.status}).eq('id',id);
  if(error){a.status=oldStatus;patchRow(id);renderStats();toast('Erreur: '+error.message,true);return}
  // Duplication uniquement quand on coche "Vendu"
  if(checked && oldStatus!=='sold'){
    const dup={
      title:a.title,description:a.description,brand:a.brand,
      price:a.price,min_price:a.min_price,size:a.size,color:a.color,
      supplier_url:a.supplier_url,vinted_account_id:a.vinted_account_id,
      images:a.images,status:'draft'
    };
    const{data:newRow,error:e2}=await sb.from('articles')
      .insert(dup)
      .select('id,title,description,brand,price,min_price,size,color,supplier_url,images,status,prolonged,warehouse,vinted_account_id,created_at, vinted_account:vinted_accounts!vinted_account_id(id,name)')
      .single();
    if(e2){toast('Vendu OK — erreur duplication: '+e2.message,true);return}
    if(newRow){
      const dupArt={...newRow,images:Array.isArray(newRow.images)?newRow.images:[]};
      articles.unshift(dupArt);
      // Insert le nouveau <tr> en haut sans toucher aux autres
      const tbody=document.getElementById('tbody');
      const tmp=document.createElement('tbody');
      tmp.innerHTML=renderRow(dupArt);
      const firstEmpty=tbody.querySelector('.empty-row');
      if(firstEmpty) firstEmpty.remove();
      tbody.insertBefore(tmp.firstElementChild,tbody.firstElementChild);
      renderStats(); majComptes();
      toast('Vendu ✓ — Copie créée pour reposter');
    }
  } else {
    toast(checked?'Vendu ✓':'Vente annulée');
  }
}

async function supprimer(id){
  const skipConfirm=localStorage.getItem('noConfirmDelete')==='true';
  if(!skipConfirm && !confirm('Supprimer ce produit ?')) return;

  // Optimistic : retire du DOM + array immédiatement
  const idx=articles.findIndex(a=>a.id===id);
  if(idx<0) return;
  const backup=articles[idx];
  document.querySelector(`tr[data-id="${id}"]`)?.remove();
  articles.splice(idx,1);
  renderStats(); majComptes();
  const tbody=document.getElementById('tbody');
  if(!tbody.querySelector('tr')) tbody.innerHTML='<tr class="empty-row"><td colspan="10">Aucun résultat.</td></tr>';

  const{error}=await sb.from('articles').delete().eq('id',id);
  if(error){
    articles.splice(idx,0,backup);
    render(); renderStats(); majComptes();
    toast('Erreur: '+error.message,true);
    return;
  }
  toast('Supprimé ✓');
}

/* === PREVIEW (lecture seule) === */
function goEdit(id){ location.href=`equipe.html?id=${id}` }

function openPreview(id){
  const a=articles.find(x=>x.id===id);
  if(!a)return;
  const name=a.title||hostName(a.supplier_url||'');
  document.getElementById('pvTitle').textContent=name;

  // Meta : prix, taille, couleur, compte
  const metaParts=[];
  if(a.price) metaParts.push(`<span class="tag green">${a.price} €</span>`);
  if(a.min_price) metaParts.push(`<span class="tag amber">Min ${a.min_price} €</span>`);
  if(a.size) metaParts.push(`<span class="tag neutral">${esc(a.size)}</span>`);
  if(a.color) metaParts.push(`<span class="tag neutral">${esc(a.color)}</span>`);
  if(a.vinted_account) metaParts.push(`<span class="tag neutral">🛍 ${esc(a.vinted_account.name)}</span>`);
  metaParts.push(`<span class="tag ${STATUS_TAG[a.status]||'amber'}">${STATUS_LABEL[a.status]||a.status}</span>`);
  document.getElementById('pvMeta').innerHTML=metaParts.join('');

  // Images
  const imgHost=document.getElementById('pvImages');
  if(a.images && a.images.length){
    imgHost.innerHTML=a.images.map((src,i)=>`<div class="pv-img"><img src="${esc(src)}" loading="lazy" onerror="this.style.opacity=.3"><a class="pv-dl" href="${esc(src)}" download="image_${i+1}.jpg" title="Télécharger">⬇</a></div>`).join('');
  } else {
    imgHost.innerHTML='<div class="pv-empty">Aucune image</div>';
  }

  // Champs lecture seule
  const setVal=(id,val)=>{
    const el=document.getElementById(id);
    if(val && String(val).trim()){ el.textContent=val; el.classList.remove('muted') }
    else { el.textContent='— vide —'; el.classList.add('muted') }
  };
  setVal('pvVTitle', a.title);
  setVal('pvVDesc', a.description);
  setVal('pvVBrand', a.brand);

  // Actions : lien fournisseur + modifier
  const actions=[];
  if(a.supplier_url) actions.push(`<a href="${esc(a.supplier_url)}" target="_blank" class="btn btn-ghost">🔗 Lien fournisseur</a>`);
  actions.push(`<button class="btn btn-fiche" onclick="goEdit('${a.id}')">✏️ Modifier la fiche</button>`);
  document.getElementById('pvActions').innerHTML=actions.join('');

  document.getElementById('previewModal').classList.add('open');
}

function closePreview(){ document.getElementById('previewModal').classList.remove('open') }

function pvCopy(id,btn){
  const text=document.getElementById(id).textContent;
  if(!text || text==='— vide —'){ toast('Champ vide',true); return }
  navigator.clipboard.writeText(text).then(()=>{
    btn.textContent='Copié ✓'; btn.classList.add('copied');
    setTimeout(()=>{ btn.textContent='Copier'; btn.classList.remove('copied') },1500);
  }).catch(()=>toast('Erreur copie',true));
}
